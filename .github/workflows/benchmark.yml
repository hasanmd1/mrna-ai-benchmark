name: Empirical mRNA Benchmark Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  run-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System and Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Empirical Research Benchmark
        run: |
          python src/empirical_benchmark.py

      - name: Archive Research Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: preprint-benchmark-artifacts
          path: results/